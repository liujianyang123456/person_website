<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>网站状态 · 刘建阳</title>
  <meta name="description" content="网站构建状态与自动检查结果，让 Agent 的工作可观测。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <p class="brand"><a href="index.html">person_website</a></p>
    <nav class="site-nav" aria-label="主导航">
      <ul>
        <li><a href="index.html">首页</a></li>
        <li><a href="about.html">关于我</a></li>
        <li><a href="blog.html">博客</a></li>
        <li><a href="archive.html">归档</a></li>
        <li><a href="papers.html">Research Papers</a></li>
        <li><a href="wiki.html">Wiki</a></li>
        <li><a href="rss.html">RSS订阅</a></li>
        <li><a href="status.html" aria-current="page">网站状态</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" tabindex="-1">
    <section class="hero">
      <h1>网站状态</h1>
      <p class="meta">数据由 <code>scripts/build_status.py</code> 在每次构建时生成
         （<code>public/data/status.json</code>），检查失败会中止 CI 部署。</p>
    </section>

    <section aria-labelledby="counts-title">
      <h2 id="counts-title">站点数据</h2>
      <p id="status-note" class="meta" aria-live="polite">正在加载…</p>
      <table id="status-table">
        <thead><tr><th>指标</th><th>数值</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section aria-labelledby="checks-title">
      <h2 id="checks-title">自动检查结果</h2>
      <table id="checks-table">
        <thead><tr><th>检查项</th><th>结果</th><th>说明</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section aria-labelledby="daily-title">
      <h2 id="daily-title">最近自动运行</h2>
      <p id="daily-note" class="meta" aria-live="polite">正在加载…</p>
      <table id="daily-table">
        <thead><tr><th>步骤</th><th>结果</th><th>说明</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer class="site-footer">
    © 2026 刘建阳 · 用 AI Agent 协作构建 ·
    <a href="status.html">网站状态</a> ·
    <a href="feed.xml">RSS</a>
  </footer>

  <script>
    (function () {
      var note = document.getElementById("status-note");
      var statusBody = document.querySelector("#status-table tbody");
      var checksBody = document.querySelector("#checks-table tbody");

      if (location.protocol === "file:") {
        note.textContent = "当前是双击打开的页面（file:// 协议），浏览器会拦截本地数据文件的读取。"
          + "请运行 python scripts/serve.py 8080，然后访问 http://localhost:8080/status.html";
        row(statusBody, ["状态数据", "未加载"]);
        return;
      }

      function row(tbody, cells) {
        var tr = document.createElement("tr");
        cells.forEach(function (text, i) {
          var td = document.createElement("td");
          td.textContent = text;
          if (i === 1) { td.className = "status-num"; }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      }

      function checkClass(word) {
        if (word === "通过") { return "status-pass"; }
        if (word === "失败") { return "status-fail"; }
        return "status-skip";
      }

      function render(data) {
        note.textContent = "最近构建时间：" + data.build_time;
        var counts = data.counts || {};
        var countLabels = [
          ["页面数（public 下 HTML）", "pages"],
          ["博客文章数", "posts"],
          ["Wiki 页面数", "wiki"],
          ["论文数", "papers"],
          ["RSS 订阅源数", "rss_feeds"],
          ["RSS 订阅条目数", "rss_items"]
        ];
        countLabels.forEach(function (pair) {
          var value = counts[pair[1]];
          row(statusBody, [pair[0], value === null || value === undefined ? "—" : String(value)]);
        });

        var checks = data.checks || {};
        Object.keys(checks).forEach(function (name) {
          var c = checks[name];
          var tr = document.createElement("tr");
          var tdName = document.createElement("td");
          tdName.textContent = name;
          var tdWord = document.createElement("td");
          tdWord.className = checkClass(c.status);
          tdWord.textContent = c.status;
          var tdDetail = document.createElement("td");
          tdDetail.textContent = c.detail || "";
          tr.appendChild(tdName);
          tr.appendChild(tdWord);
          tr.appendChild(tdDetail);
          checksBody.appendChild(tr);
        });
      }

      fetch("data/status.json")
        .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.json(); })
        .then(render)
        .catch(function () {
          note.textContent = "";
          row(statusBody, ["状态数据", "尚未生成"]);
          row(checksBody, ["说明", "—", "请先运行 python scripts/build_all.py"]);
        });

      // 每日自动流水线最近一次运行记录（scripts/run_daily.py 生成）。
      // 外部数据只经 textContent 渲染，禁止 innerHTML。
      var dailyNote = document.getElementById("daily-note");
      var dailyBody = document.querySelector("#daily-table tbody");

      function dailyRow(label, word, wordClass, detail) {
        row(dailyBody, [label, word, detail]);
        dailyBody.lastChild.children[1].className = wordClass;
      }

      fetch("data/last_run.json")
        .then(function (r) { if (!r.ok) { throw new Error("HTTP " + r.status); } return r.json(); })
        .then(function (run) {
          dailyNote.textContent = "最近运行时间：" + run.run_time
            + "（触发方式：" + (run.trigger || "manual") + "）";
          var stepLabels = [
            ["collect_papers", "collect_papers（arXiv 论文收集）"],
            ["fetch_rss", "fetch_rss（外部订阅抓取）"],
            ["build", "build_all（构建与全部检查）"]
          ];
          stepLabels.forEach(function (pair) {
            var s = (run.steps || {})[pair[0]] || {};
            dailyRow(pair[1], s.ok ? "通过" : "失败",
                     s.ok ? "status-pass" : "status-fail", s.detail || "—");
          });
          var changed = run.changed_files || [];
          dailyRow("产生变更的文件", String(changed.length) + " 个", "status-num",
                   changed.length ? changed.slice(0, 5).join("、") + (changed.length > 5 ? " 等" : "") : "无");
        })
        .catch(function () {
          dailyNote.textContent = "尚无自动运行记录：等待 GitHub Actions 定时任务，"
            + "或本地运行 python scripts/run_daily.py";
          dailyRow("运行记录", "未运行", "status-skip",
                   "运行后本页会展示论文收集、订阅抓取与构建的逐步结果");
        });
    })();
  </script>
</body>
</html>
